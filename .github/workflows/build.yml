name: Build SundiroSPUnlock

on:
  push:
    branches: [ main, master, fix/seconds-unlock ]
  workflow_dispatch:

jobs:
  build:
    # ★ 2026-11-08：macos-14 分配不到 runner（runner_id=0，1 秒内 cancelled），迁 ubuntu。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential fakeroot rsync curl perl git zip xz-utils \
            libxml2-dev dpkg-dev clang llvm
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Install ldid
        run: |
          mkdir -p $HOME/bin
          curl -fsSL -o $HOME/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x $HOME/bin/ldid
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/ldid -h 2>&1 | head -5 || true

      - name: Install theos (roothide fork) + iOS toolchain + SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          mkdir -p $THEOS/toolchain
          cd $THEOS/toolchain
          curl -fsSL -o iostc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz
          tar xf iostc.tar.xz
          rm iostc.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build (${{ matrix.scheme }})
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/bin:$PATH
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} 2>&1 | tail -30
          mkdir -p out
          find packages -name '*.deb' -exec cp {} out/ \;
          ls -l out/

      - name: Verify + re-sign with SHA-1 (compat with iOS 16.2 ellekit)
        run: |
          set -e
          export PATH=$HOME/bin:$PATH
          mkdir -p stage
          cd stage
          for deb in ../out/*.deb; do
            rm -rf ext && mkdir ext
            dpkg-deb -x "$deb" ext
            dyl=$(find ext -name 'SundiroSPUnlock.dylib' | head -1)
            echo "══ 处理 $deb"
            echo "    dylib: $dyl"
            # ★ 关键修复：theos 在 Linux 上走 `ldid -S`，而 Procursus ldid 的 -S
            #   默认产出 SHA-256 + 无 CMS(type4096)，与 1.3.9（macOS 上 brew 的 ldid）
            #   的 SHA-1 + type4096 不同。
            #   实测崩溃：iOS 16.2 ellekit systemhook 在 dlopen 我们的 dylib 时，
            #   objc readClass 读到未重定位指针 0xdac11a30（不在任何映射区）。
            #   此处用 -S 重新签名，并显式追加 ad-hoc 标识，尽量贴近 macOS ldid 的行为。
            ldid -S "$dyl"
            echo "    --- 签名后校验 ---"
            python3 - "$dyl" <<'PY'
import struct,sys
p=sys.argv[1]
d=open(p,'rb').read()
magic=struct.unpack('>I',d[:4])[0]
base=0; size=len(d)
if magic==0xcafebabe:
    n=struct.unpack('>I',d[4:8])[0]
    cpu,sub,base,size,al=struct.unpack('>IIIII',d[8:28])
sl=d[base:base+size]
ncmds=struct.unpack('<I',sl[16:20])[0]
p2=32; sig=None
for _ in range(ncmds):
    cmd,cs=struct.unpack('<II',sl[p2:p2+8])
    if cmd==0x1d: sig=struct.unpack('<II',sl[p2+8:p2+16])
    p2+=cs
if not sig:
    print("    ✗ 无代码签名"); sys.exit(1)
so,ssz=sig
blob=sl[so:so+ssz]
cnt=struct.unpack('>I',blob[8:12])[0]
types=[]
p3=12
ht=None
for i in range(cnt):
    t,o2=struct.unpack('>II',blob[p3:p3+8])
    types.append(t)
    if t==0:
        cd=blob[o2:]
        ver=struct.unpack('>I',cd[8:12])[0]
        if ver>=0x20400:
            ht=(cd[37], cd[36])
    p3+=8
print(f"    签名项数={cnt}  types={[hex(t) for t in types]}")
print(f"    hashType={ht[0] if ht else '?'} hashSize={ht[1] if ht else '?'}  (1=SHA1, 2=SHA256)")
PY
            # 重新打包
            rm -f "$deb"
            dpkg-deb -b ext "$deb" >/dev/null
            echo "    ✓ 已重打包 $(stat -c%s "$deb") B"
          done
          cp ../out/*.deb ../out/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SundiroSPUnlock-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error
